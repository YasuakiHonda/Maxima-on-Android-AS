# Builds the native binaries (ECL + Maxima, gnuplot, QEPCAD) for all ABIs
# with native/docker-build.sh. Pushing a tag named native-* publishes a
# GitHub Release with moa-native.zip (consumed by app/build.gradle) and the
# exact upstream source archives used (GPL corresponding source; the
# patches and build scripts are in this repository at the tagged commit).
name: native

on:
  push:
    tags: ['native-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: native/docker-build.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: moa-native
          path: |
            native/out/moa-native.zip
            native/out/moa-native.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/native-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          . native/versions.env
          sha=$(cut -d' ' -f1 native/out/moa-native.zip.sha256)
          cat > notes.md <<NOTES
          Native binaries for arm64-v8a and x86_64, built from commit ${GITHUB_SHA} with NDK ${NDK_VERSION}:
          ECL ${ECL_VERSION}, Maxima ${MAXIMA_VERSION}, gnuplot ${GNUPLOT_VERSION}, saclib ${SACLIB_VERSION}, QEPCAD B ${QEPCAD_VERSION}.

          To use it, set in native/prebuilt.properties:

              tag=${TAG}
              sha256=${sha}

          The source archives below are the unmodified upstream sources; the patches and
          build scripts are under native/ at ${GITHUB_SHA}.
          NOTES
          title="Maxima ${MAXIMA_VERSION} · ECL ${ECL_VERSION} · gnuplot ${GNUPLOT_VERSION} · QEPCAD B ${QEPCAD_VERSION} (${TAG})"
          gh release create "$TAG" --title "$title" --notes-file notes.md \
            native/out/moa-native.zip native/out/moa-native.zip.sha256 \
            native/.build/dl/*
